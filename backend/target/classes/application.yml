server:
  port: 8081

spring:
  application:
    name: pfe-platform-backend

  main:
    allow-circular-references: true

  datasource:
    url: jdbc:sqlserver://LAPTOP-M7HILU4Q;databaseName=dbDWH;integratedSecurity=true;encrypt=false;trustServerCertificate=true
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  flyway:
    enabled: false

  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,flyway
  endpoint:
    health:
      show-details: always

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-password}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  jwt:
    secret: ${JWT_SECRET:PFEImenSecretKey2024VeryLongSecretKeyForJWTSigning1234567890ABCDEF}
    expiration: 86400000  # 24h in ms
    refresh-expiration: 604800000  # 7 days

  ml-service:
    url: ${ML_SERVICE_URL:http://localhost:8000}

  cors:
    allowed-origins:
      - http://localhost:4200
      - http://localhost:3000

logging:
  level:
    com.pfe: DEBUG
    org.springframework.security: WARN
