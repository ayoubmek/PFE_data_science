server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: pfe-platform-backend

  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://${DB_HOST:localhost};databaseName=${DB_NAME:dbDWH};integratedSecurity=${DB_INTEGRATED_SECURITY:true};encrypt=false;trustServerCertificate=true}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION_MS:86400000}

  seed:
    admin-password: ${APP_ADMIN_PASSWORD:}
    operateur-password: ${APP_OPERATEUR_PASSWORD:}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}

  cache:
    ttl-minutes: ${CACHE_TTL_MINUTES:10}

  ml-service:
    url: ${ML_SERVICE_URL:http://localhost:8000}
    api-key: ${ML_API_KEY:}
    timeout-seconds: ${ML_TIMEOUT_SECONDS:300}

  stock:
    conso-window-days: ${STOCK_CONSO_WINDOW_DAYS:365}
    rupture-recent-days: ${STOCK_RUPTURE_RECENT_DAYS:30}
    critique-days: ${STOCK_CRITIQUE_DAYS:15}
    surstock-days: ${STOCK_SURSTOCK_DAYS:120}
    coverage-target-days: ${STOCK_COVERAGE_TARGET_DAYS:45}

  production:
    orders-limit: ${PRODUCTION_ORDERS_LIMIT:2000}

logging:
  level:
    com.pfe: INFO
    org.springframework.security: WARN
